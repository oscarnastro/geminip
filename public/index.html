<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeminiP – Assistente AI</title>
  <style>
    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.1rem;
      line-height: 1.6;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Skip link ---- */
    .skip-link {
      position: absolute;
      top: -999px;
      left: 0;
      background: #005fcc;
      color: #fff;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      text-decoration: none;
      z-index: 100;
    }
    .skip-link:focus { top: 0; }

    /* ---- Header ---- */
    header {
      background: #1a73e8;
      color: #fff;
      padding: 1rem 1.5rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    header p {
      font-size: 0.95rem;
      margin-top: 0.2rem;
      opacity: 0.9;
    }

    /* ---- Main layout ---- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      gap: 1rem;
    }

    /* ---- Toolbar ---- */
    .toolbar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar button {
      padding: 0.4rem 0.9rem;
      font-size: 1rem;
      border: 2px solid #005fcc;
      border-radius: 4px;
      background: #fff;
      color: #005fcc;
      cursor: pointer;
    }
    .toolbar button:hover, .toolbar button:focus {
      background: #005fcc;
      color: #fff;
      outline: 3px solid #ffb300;
      outline-offset: 2px;
    }

    /* ---- Conversation log ---- */
    #conversation-region {
      flex: 1;
      min-height: 300px;
    }
    #conversation {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      border: 2px solid #ccc;
      border-radius: 6px;
      padding: 1rem;
      background: #fff;
    }
    #conversation:focus { outline: 3px solid #005fcc; }

    #conversation li {
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      max-width: 85%;
      word-break: break-word;
    }
    #conversation li.user-message {
      background: #d2e3fc;
      align-self: flex-end;
      text-align: right;
    }
    #conversation li.assistant-message {
      background: #e8f5e9;
      align-self: flex-start;
    }
    #conversation li .label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
      color: #444;
    }
    #conversation li.user-message .label { color: #1557b0; }
    #conversation li.assistant-message .label { color: #276221; }

    /* ---- Busy indicator ---- */
    #status {
      min-height: 1.4rem;
      font-size: 0.95rem;
      color: #555;
      font-style: italic;
    }

    /* ---- Input form ---- */
    #chat-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #chat-form label {
      font-weight: 700;
      font-size: 1rem;
    }
    #message-input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 1.05rem;
      border: 2px solid #aaa;
      border-radius: 4px;
      resize: vertical;
      min-height: 80px;
    }
    #message-input:focus {
      outline: 3px solid #005fcc;
      border-color: #005fcc;
    }
    .form-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn-primary {
      padding: 0.55rem 1.4rem;
      font-size: 1.05rem;
      font-weight: 700;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: #1557b0;
      outline: 3px solid #ffb300;
      outline-offset: 2px;
    }
    .btn-primary:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }

    /* ---- Footer ---- */
    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
      padding: 0.8rem;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#message-input">Vai al campo di testo</a>

  <header>
    <h1>GeminiP – Assistente AI</h1>
    <p>Chat accessibile con Google Gemini. Usa Tab per navigare, Invio per inviare.</p>
  </header>

  <main>

    <section class="toolbar" aria-label="Azioni">
      <button type="button" id="btn-new-chat">Nuova conversazione</button>
      <button type="button" id="btn-copy-last">Copia ultima risposta</button>
    </section>

    <section aria-label="Conversazione" id="conversation-region">
      <ul
        id="conversation"
        tabindex="0"
        aria-label="Messaggi della conversazione"
        aria-live="polite"
        aria-relevant="additions"
        aria-atomic="false"
      >
        <li class="assistant-message" id="msg-welcome">
          <span class="label">Gemini</span>
          Ciao! Sono il tuo assistente AI. Come posso aiutarti oggi?
        </li>
      </ul>
    </section>

    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>

    <form id="chat-form" aria-label="Invia messaggio" novalidate>
      <label for="message-input">Il tuo messaggio:</label>
      <textarea
        id="message-input"
        name="message"
        rows="3"
        placeholder="Scrivi qui il tuo messaggio…"
        aria-required="true"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="btn-send">Invia (Invio)</button>
      </div>
    </form>

  </main>

  <footer>
    <p>GeminiP – Proxy accessibile per Google Gemini</p>
  </footer>

  <script>
    (function () {
      "use strict";

      // --- State ---
      const history = []; // [{role: "user"|"model", parts: string}]
      let busy = false;

      // --- DOM refs ---
      const form = document.getElementById("chat-form");
      const input = document.getElementById("message-input");
      const sendBtn = document.getElementById("btn-send");
      const conversation = document.getElementById("conversation");
      const statusEl = document.getElementById("status");
      const btnNewChat = document.getElementById("btn-new-chat");
      const btnCopyLast = document.getElementById("btn-copy-last");

      // --- Helpers ---

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function setBusy(value) {
        busy = value;
        sendBtn.disabled = value;
        input.disabled = value;
        setStatus(value ? "Attendere… Gemini sta elaborando la risposta." : "");
      }

      function addMessage(role, text) {
        const li = document.createElement("li");
        li.className = role === "user" ? "user-message" : "assistant-message";

        const labelSpan = document.createElement("span");
        labelSpan.className = "label";
        labelSpan.textContent = role === "user" ? "Tu" : "Gemini";

        const textNode = document.createTextNode(text);

        li.appendChild(labelSpan);
        li.appendChild(textNode);

        conversation.appendChild(li);
        // Scroll to the new message
        li.scrollIntoView({ block: "end", behavior: "smooth" });
        return li;
      }

      function clearConversation() {
        conversation.innerHTML = "";
        history.length = 0;
        setStatus("");

        // Re-add welcome message
        const li = document.createElement("li");
        li.className = "assistant-message";
        li.id = "msg-welcome";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Gemini";
        li.appendChild(label);
        li.appendChild(document.createTextNode("Conversazione riavviata. Come posso aiutarti?"));
        conversation.appendChild(li);

        setStatus("Nuova conversazione iniziata.");
      }

      function getLastAssistantText() {
        const items = conversation.querySelectorAll("li.assistant-message");
        if (!items.length) return "";
        const last = items[items.length - 1];
        // Return text without the label span
        const label = last.querySelector(".label");
        const clone = last.cloneNode(true);
        if (clone.querySelector(".label")) {
          clone.querySelector(".label").remove();
        }
        return clone.textContent.trim();
      }

      // --- Send message ---

      async function sendMessage(text) {
        if (busy || !text.trim()) return;

        setBusy(true);

        addMessage("user", text);
        history.push({ role: "user", parts: text });

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ history: history.slice(0, -1), message: text }),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || "Errore del server.");
          }

          addMessage("model", data.response);
          history.push({ role: "model", parts: data.response });
          setStatus("Risposta ricevuta.");
        } catch (err) {
          const errMsg = err.message || "Errore sconosciuto.";
          addMessage("model", "⚠️ " + errMsg);
          // Remove the last user entry from history since the exchange failed
          history.pop();
          setStatus("Errore: " + errMsg);
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      // --- Event listeners ---

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = input.value;
        if (!text.trim()) {
          setStatus("Il messaggio è vuoto. Scrivi qualcosa prima di inviare.");
          input.focus();
          return;
        }
        input.value = "";
        sendMessage(text);
      });

      // Allow Ctrl+Enter or just Enter (without Shift) to submit from textarea
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.dispatchEvent(new Event("submit", { cancelable: true }));
        }
      });

      btnNewChat.addEventListener("click", function () {
        if (busy) return;
        clearConversation();
        input.focus();
      });

      btnCopyLast.addEventListener("click", function () {
        const text = getLastAssistantText();
        if (!text) {
          setStatus("Nessuna risposta da copiare.");
          return;
        }
        navigator.clipboard.writeText(text).then(function () {
          setStatus("Ultima risposta copiata negli appunti.");
        }).catch(function () {
          setStatus("Impossibile copiare: permesso negato.");
        });
      });

    })();
  </script>

</body>
</html>
